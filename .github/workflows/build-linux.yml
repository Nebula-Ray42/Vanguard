name: Linux Build

on:
  push:
    branches: [ "main", "refactor/*" ]
  pull_request:
    branches: [ "main" ]

env:
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build pkg-config autoconf autoconf-archive automake libtool m4 xutils-dev libx11-dev libx11-xcb-dev libxi-dev libxext-dev libgl1-mesa-dev libudev-dev libwayland-dev libxkbcommon-dev libxinerama-dev libxcursor-dev libxrandr-dev

      - name: Setup Vulkan SDK 1.4
        uses: humbletim/setup-vulkan-sdk@v1.2.1
        with:
          vulkan-query-version: 1.4.309.0
          vulkan-components: Vulkan-Headers, Vulkan-Loader

      - name: Export GitHub Actions Cache API
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Configure CMake
        run: |
          cmake -B cmake-build-debug -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-linux

      - name: Build
        run: cmake --build cmake-build-debug
